# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
kotlin.incremental=true
# Kotlin/Native declines to link iosX64Test on this host (Apple Silicon can't run the x64 iOS
# simulator target natively) - a real, unavoidable limitation, not a bug, so this only silences
# the resulting warning rather than working around anything.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
kotlin.code.style=official
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
# The recommended value, not merely the warning's suggested suppression - actually improves
# project sync/import performance rather than just silencing the message about it.
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false
# Needed only for test-app, not the published library: the root and statement-parser-datastore
# modules migrated to the com.android.kotlin.multiplatform.library plugin, which does not need
# this bypass. test-app still applies com.android.application alongside Kotlin Multiplatform,
# and Google currently has no KMP-compatible replacement for that combination - their own
# migration guide's only suggestion is extracting the app into a separate, non-KMP module, which
# is a much larger restructuring than this fixes. Verified by removing these two properties
# entirely: root and statement-parser-datastore build and test cleanly without them; only
# test-app's plugin application fails, with this exact bypass suggested in the error itself.
android.builtInKotlin=false
android.newDsl=false


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

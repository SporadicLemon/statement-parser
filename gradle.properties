# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
kotlin.incremental=true
# Kotlin/Native declines to link iosX64Test on this host (Apple Silicon can't run the x64 iOS
# simulator target natively) - a real, unavoidable limitation, not a bug, so this only silences
# the resulting warning rather than working around anything.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
kotlin.code.style=official
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
# The recommended value, not merely the warning's suggested suppression - actually improves
# project sync/import performance rather than just silencing the message about it.
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false
# Required, not optional: com.android.library and org.jetbrains.kotlin.multiplatform have been
# mutually incompatible since AGP 9.0. Without these two, every module using both plugins fails
# to configure at all. The real fix is migrating to the com.android.kotlin.multiplatform.library
# plugin - a separate, bigger change, not a one-line property removal - see
# https://developer.android.com/kotlin/multiplatform/plugin.
android.builtInKotlin=false
android.newDsl=false


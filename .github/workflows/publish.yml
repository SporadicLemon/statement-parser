name: Publish
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Actions are pinned by full commit SHA rather than a mutable tag - a tag can be moved to
      # point at different code after the fact, a commit SHA cannot. The trailing comment names
      # the release each SHA corresponds to, so bumping later just means re-resolving the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      # Pinned to the v5 line, not v6: gradle/actions@v6 bundles a new, proprietary
      # "gradle-actions-caching" component under a separate commercial Terms of Use - see
      # https://blog.gradle.org/github-actions-for-gradle-v6. v5.0.2 already runs on the Node 24
      # runtime (resolving the same deprecation v6 does) without that licensing change.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Publish to GitHub Packages
        run: ./gradlew :publishAllPublicationsToGitHubPackagesRepository :statement-parser-datastore:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      # Uploads and validates but does not auto-release - same as running this locally, the
      # deployment sits pending in the Central Portal for manual review before going live.
      # ORG_GRADLE_PROJECT_<name> is Gradle's own convention for exposing an environment variable
      # as the project property <name>, which is what build.gradle.kts's signing gate and the
      # vanniktech plugin's mavenCentralUsername/Password both read - no code change needed for
      # this to work, only these secrets existing in the repo.
      #
      # SIGNING_IN_MEMORY_KEY must be the raw, unescaped multi-line key exported by
      # `gpg --armor --export-secret-keys` - unlike gradle.properties, a GitHub secret has no
      # single-line restriction, so the \n-escaping trick used there does not apply here.
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral :statement-parser-datastore:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

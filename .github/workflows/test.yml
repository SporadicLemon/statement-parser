name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: macos-latest
    steps:
      # Actions are pinned by full commit SHA rather than a mutable tag - a tag can be moved to
      # point at different code after the fact, a commit SHA cannot. The trailing comment names
      # the release each SHA corresponds to, so bumping later just means re-resolving the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # Matches toolchainVersion in gradle/gradle-daemon-jvm.properties, so Gradle does not
          # provision a second JDK from foojay on every run.
          java-version: 21
      # Pinned to the v5 line, not v6: gradle/actions@v6 bundles a new, proprietary
      # "gradle-actions-caching" component under a separate commercial Terms of Use - see
      # https://blog.gradle.org/github-actions-for-gradle-v6. v5.0.2 already runs on the Node 24
      # runtime (resolving the same deprecation v6 does) without that licensing change.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      # Named modules, not "allTests": the latter also configures and builds the whole
      # test-app Compose application, which has no tests. statement-parser-datastore is listed
      # explicitly since a root-scoped ":allTests" does not reach into subprojects.
      - name: Run tests
        run: ./gradlew :allTests :statement-parser-datastore:allTests
